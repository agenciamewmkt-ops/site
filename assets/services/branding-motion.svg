<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Escultura de fitas cobre e identidade visual em movimento">
<defs>
<radialGradient id="bg"><stop stop-color="#fff7e8"/><stop offset=".65" stop-color="#f0dfc6"/><stop offset="1" stop-color="#d9bb97"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#fff5d9"/><stop offset=".17" stop-color="#c99357"/><stop offset=".35" stop-color="#fce7c2"/><stop offset=".55" stop-color="#94502c"/><stop offset=".7" stop-color="#f4cf9b"/><stop offset="1" stop-color="#a8683b"/></linearGradient>
<linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#874828"/><stop offset=".35" stop-color="#f5d9a8"/><stop offset=".6" stop-color="#ca8753"/><stop offset="1" stop-color="#fff6d9"/></linearGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="20"/></filter>
<style>
.ribbon1{animation:sway1 9s ease-in-out infinite alternate;transform-origin:300px 300px}.ribbon2{animation:sway2 12s ease-in-out infinite alternate;transform-origin:320px 275px}.ribbon3{animation:sway3 10s ease-in-out infinite alternate;transform-origin:270px 300px}.glint{animation:glint 5s ease-in-out infinite alternate}
@keyframes sway1{to{transform:rotate(10deg) translate(4px,-8px) scale(1.04)}}
@keyframes sway2{to{transform:rotate(-12deg) translate(-9px,5px) scale(1.03)}}
@keyframes sway3{to{transform:rotate(9deg) translate(7px,-4px)}}@keyframes glint{to{opacity:.2;transform:translateX(22px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect width="600" height="600" fill="url(#bg)"/>
<path d="M0 510C190 450 360 580 600 460V600H0Z" fill="#f2dfc6" opacity=".65"/>
<ellipse cx="307" cy="497" rx="197" ry="35" fill="#7c5036" opacity=".17" filter="url(#shadow)"/>
<g class="ribbon2"><path d="M81 360C97 220 203 166 257 216S363 350 481 206C537 141 560 155 586 173C550 279 474 368 381 349S254 218 185 299C148 346 167 416 123 453Z" fill="url(#gold2)" stroke="#efca98" stroke-width="4"/></g>
<g class="ribbon1"><path d="M96 437C155 389 197 243 262 172C313 118 410 158 424 227C437 296 385 351 324 345C262 339 258 281 301 254C328 236 364 253 366 281C368 302 356 314 336 319C405 316 447 249 394 199C337 149 261 227 235 309C213 377 215 446 140 479Z" fill="url(#gold)" stroke="#efcfa7" stroke-width="3"/></g>
<g class="ribbon3"><path d="M190 97C280 157 290 237 341 304C384 363 432 352 476 328C532 298 543 230 567 216C569 337 496 425 410 420C307 414 282 337 240 269C202 209 165 166 190 97Z" fill="url(#gold2)" opacity=".96"/></g>
<path d="M136 445C208 405 211 317 257 244" fill="none" stroke="#ffefd2" stroke-width="7" stroke-linecap="round" opacity=".73" class="glint"/>
<circle cx="479" cy="126" r="38" fill="none" stroke="#fff7e8" stroke-width="1.5" opacity=".7"/>
<circle cx="479" cy="126" r="22" fill="none" stroke="#d0a678" stroke-width="1.5" opacity=".7"/>
<path d="M475 96V156M449 126H509" stroke="#d4ab81" stroke-width="1" opacity=".65"/>
<text x="40" y="555" font-family="Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="4" fill="#936e52">FORM • IDENTITY • EXPRESSION</text>
</svg>
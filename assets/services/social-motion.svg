<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Composições digitais e conteúdo em movimento">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9f2e5"/><stop offset=".53" stop-color="#ead8bf"/><stop offset="1" stop-color="#c99062"/></linearGradient>
<linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#40261b"/><stop offset="1" stop-color="#140e0c"/></linearGradient>
<linearGradient id="poster" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0c99c"/><stop offset=".55" stop-color="#ae6d47"/><stop offset="1" stop-color="#613624"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#ffeacf"/><stop offset="1" stop-color="#bd8157"/></linearGradient>
<filter id="drop"><feGaussianBlur stdDeviation="18"/></filter>
<clipPath id="screen"><rect x="183" y="108" width="234" height="382" rx="19"/></clipPath>
<style>
.float-a{animation:floatA 7s ease-in-out infinite}.float-b{animation:floatB 8s ease-in-out infinite}.feed{animation:feed 9s ease-in-out infinite alternate}.bubble{animation:bubble 5s ease-in-out infinite alternate}.orbit{animation:spin 25s linear infinite;transform-origin:300px 300px}
@keyframes floatA{0%,100%{transform:translate(-6px,6px) rotate(-8deg)}50%{transform:translate(4px,-7px) rotate(-4deg)}}
@keyframes floatB{0%,100%{transform:translate(7px,-5px) rotate(10deg)}50%{transform:translate(-4px,7px) rotate(5deg)}}
@keyframes feed{0%,22%{transform:translateY(0)}76%,100%{transform:translateY(-100px)}}
@keyframes bubble{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<rect width="600" height="600" fill="url(#bg)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Interface de site responsivo com rolagem e elementos animados">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf6ec"/><stop offset=".6" stop-color="#eddcc4"/><stop offset="1" stop-color="#d7b697"/></linearGradient>
<linearGradient id="webhero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39241b"/><stop offset="1" stop-color="#7b4d34"/></linearGradient>
<linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7dab1"/><stop offset=".55" stop-color="#b97342"/><stop offset="1" stop-color="#fff1d1"/></linearGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter><clipPath id="viewport"><rect x="70" y="131" width="460" height="315" rx="3"/></clipPath>
<style>
.scroll{animation:scroll 10s ease-in-out infinite alternate}.float{animation:float 7s ease-in-out infinite alternate}.pointer{animation:cursor 7s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite alternate}
@keyframes scroll{0%,15%{transform:translateY(0)}83%,100%{transform:translateY(-116px)}}@keyframes float{to{transform:translateY(-13px) rotate(9deg)}}@keyframes pulse{to{opacity:.38;transform:scale(1.1)}}@keyframes cursor{0%,24%{transform:translate(0,0)}45%{transform:translate(-50px,38px)}60%{transform:translate(-18px,83px)}82%,100%{transform:translate(0,0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
